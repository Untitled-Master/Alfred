name: PR checks

# Fast checks for pull requests: install + smoke tests.
# No packaging here — the Windows installer builds on merge (build.yml).
on:
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Checks and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts skips the electron-builder native postinstall;
      # PR checks only need the dependency tree + pure-node tests.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run smoke tests
        run: npm test
